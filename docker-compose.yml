services:
  api:
    build:
      context: ./backend
      dockerfile: src/RosnetHealth.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Data Source=/data/rosnethealth.db"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    volumes:
      - rosnethealth-data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  rosnethealth-data:
